apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: love-app
  template:
    metadata:
      labels:
        app: love-app
    spec:
      containers:
      - name: love-app
        image: 255621206052.dkr.ecr.ap-south-2.amazonaws.com/devops-webapp:latest
        ports:
        - containerPort: 8080
